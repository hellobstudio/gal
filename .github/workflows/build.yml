name: APK készítése

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Aláíró kulcs előkészítése (ha meg van adva)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Saját aláíró kulcs használata."
          else
            echo "::warning::Nincs KEYSTORE_BASE64 secret – az APK ideiglenes kulccsal lesz aláírva, frissítéshez előbb törölni kell a régi verziót. Lásd README."
          fi

      - name: APK fordítása
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK átnevezése
        run: cp app/build/outputs/apk/release/app-release.apk Galeria.apk

      - name: APK feltöltése (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Galeria-apk
          path: Galeria.apk
          retention-days: 30

      - name: Kiadás (Release) létrehozása címkénél
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Galeria.apk
