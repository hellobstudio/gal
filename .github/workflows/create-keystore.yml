name: Aláíró kulcs létrehozása (csak egyszer kell)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Kulcs generálása
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore release.jks -storetype PKCS12 \
            -alias galeria -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Galeria"
          mkdir out
          cp release.jks out/
          {
            echo "Hozd létre ezt a 4 secretet: Settings > Secrets and variables > Actions > New repository secret"
            echo
            echo "Név: KEYSTORE_BASE64"
            echo "Érték:"
            base64 -w0 release.jks
            echo
            echo
            echo "Név: SIGNING_STORE_PASSWORD   Érték: $PASS"
            echo "Név: SIGNING_KEY_ALIAS        Érték: galeria"
            echo "Név: SIGNING_KEY_PASSWORD     Érték: $PASS"
            echo
            echo "A release.jks fájlt tedd el biztonságos helyre (pl. jelszókezelő). Ha elveszik, a telepített app nem frissíthető."
          } > out/secrets.txt

      - name: Kulcs letölthetővé tétele (1 napig)
        uses: actions/upload-artifact@v4
        with:
          name: alairo-kulcs
          path: out/
          retention-days: 1
